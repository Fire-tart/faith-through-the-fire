
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible Library | Faith Through the Fire</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#160b19,#63271e,#190c20);min-height:100vh}
header{text-align:center;padding:45px 18px;background:radial-gradient(circle,#9b3d27,#29101d 75%)}
h1{color:#ffce73;font-size:clamp(28px,6vw,45px)}
h2{color:#ffce73}
a{color:#ffce73}
main{max-width:850px;margin:25px auto;padding:15px}
.panel{background:#29131e;border:1px solid #a9573a;border-radius:20px;padding:24px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
label{display:block;margin-bottom:7px;font-weight:bold}
select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}
select{background:#fff;color:#222;border:0}
button{background:#ff7845;color:#210d15;border:0;font-weight:bold;cursor:pointer;margin-top:17px}
button:hover{background:#ffce73}
#reading{margin-top:24px;line-height:1.9;font-size:18px}
.verse{margin-bottom:13px}
.number{color:#ffce73;font-weight:bold;margin-right:8px}
.status{color:#f1d3c3}
footer{text-align:center;padding:25px}
</style>
</head>
<body>
<header>
<div style="font-size:60px">❤️‍🔥📖</div>
<h1>Faith Through the Fire</h1>
<p>✝️ The Bible Library ✝️</p>
<a href="index.html">← Back to Home</a>
</header>

<main>
<div class="panel">
<h2>📖 Read God's Word</h2>
<p>Choose your Bible translation, book, and chapter.</p>

<div class="controls">
<div>
<label for="version">Bible Translation</label>
<select id="version">
<option value="kjv">King James Version (KJV)</option>
<option value="web">World English Bible (WEB)</option>
<option value="asv">American Standard Version (ASV)</option>
</select>
</div>
<div>
<label for="book">Bible Book</label>
<select id="book"></select>
</div>
<div>
<label for="chapter">Chapter</label>
<select id="chapter"></select>
</div>
</div>

<button id="readButton">📖 Read Chapter</button>
<p id="status" class="status" role="status"></p>
<div id="reading"></div>
</div>
</main>

<footer>Faith Through the Fire ❤️‍🔥 Made with faith, hope, and love.</footer>

<script>
const books=[
["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],
["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],
["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],
["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],
["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],
["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],
["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],
["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],
["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],
["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],
["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],
["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],
["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],
["3 John",1],["Jude",1],["Revelation",22]
];

const version=document.getElementById("version");
const book=document.getElementById("book");
const chapter=document.getElementById("chapter");
const status=document.getElementById("status");
const reading=document.getElementById("reading");

books.forEach(([name])=>{
const option=document.createElement("option");
option.value=name;
option.textContent=name;
book.appendChild(option);
});
book.value="John";

function updateChapters(){
const count=books.find(([name])=>name===book.value)[1];
const previous=Number(chapter.value)||1;
chapter.replaceChildren();
for(let i=1;i<=count;i++){
const option=document.createElement("option");
option.value=i;
option.textContent=i;
chapter.appendChild(option);
}
chapter.value=String(Math.min(previous,count));
}
book.addEventListener("change",updateChapters);
updateChapters();
chapter.value="3";

async function readChapter(){
const selectedBook=book.value;
const selectedChapter=chapter.value;
const selectedVersion=version.value;
const reference=selectedBook+" "+selectedChapter;
status.textContent="Loading "+reference+"...";
reading.replaceChildren();

try{
const url="https://bible-api.com/"+encodeURIComponent(reference)
+"?translation="+encodeURIComponent(selectedVersion);
const response=await fetch(url);
if(!response.ok)throw new Error("Bible service unavailable");
const data=await response.json();
if(!Array.isArray(data.verses)||!data.verses.length){
throw new Error("Chapter not found");
}

const heading=document.createElement("h2");
heading.textContent=reference+" — "+selectedVersion.toUpperCase();
reading.appendChild(heading);

data.verses.forEach(item=>{
const p=document.createElement("p");
p.className="verse";
const number=document.createElement("span");
number.className="number";
number.textContent=item.verse+" ";
p.appendChild(number);
p.appendChild(document.createTextNode(item.text));
reading.appendChild(p);
});
status.textContent="";
}catch(error){
status.textContent="Sorry, this chapter could not load. Check your connection or try another translation.";
}
}
document.getElementById("readButton").addEventListener("click",readChapter);
readChapter();
</script>
</body>
</html>
